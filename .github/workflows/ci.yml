name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    permissions:
      actions: write  # for styfle/cancel-workflow-action to cancel/stop running workflows
      contents: read  # for actions/checkout to fetch code
    name: "${{ matrix.root-pom }} on JDK ${{ matrix.java }} on ${{ matrix.os }}"
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java: [ 8, 11, 17, 21 ]
        root-pom: [ 'pom.xml', 'android/pom.xml' ]
        include:
          - os: windows-latest
            java: 21
            root-pom: pom.xml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      ROOT_POM: ${{ matrix.root-pom }}
    steps:
      # Cancel any previous runs for the same branch that are still running.
      - name: 'Cancel previous runs'
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ github.token }}
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # When we specify multiple JDKs, the final one becomes the default, which is used to execute Maven itself.
      # Our Maven configuration then specifies different JDKs to use for some of the steps:
      # - 11 (sometimes) to *download* to support anyone who runs JDiff or our Gradle integration tests (including our doc snapshots and our Java 11 CI test run) but not to use directly
      # - 26 for running Javadoc and javac (to help people who build Guava locally and might not use a recent JDK to run Maven)
      - name: 'Set up JDKs'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: |
            ${{ matrix.java }}
            26
          distribution: 'temurin'
          cache: 'maven'
      - name: 'Install'
        shell: bash
        run: ./mvnw -B -ntp -Dtoolchain.skip install -U -DskipTests=true -f $ROOT_POM
      - name: 'Test'
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./mvnw -B -ntp -P!standard-with-extra-repos -Dtoolchain.skip verify -U -Dmaven.javadoc.skip=true -Dsurefire.toolchain.version=${{ matrix.java }} -f $ROOT_POM -Dtest="${{ inputs.test-filter }}" -Dsurefire.failIfNoSpecifiedTests=false
          else
            ./mvnw -B -ntp -P!standard-with-extra-repos -Dtoolchain.skip verify -U -Dmaven.javadoc.skip=true -Dsurefire.toolchain.version=${{ matrix.java }} -f $ROOT_POM
          fi
      - name: 'Print skipped tests with reasons'
        if: ${{ always() }}
        shell: bash
        # Surefire's console output gives only a skip count; list each skipped test with the
        # recorded reason (or the assume() line from its source), plus per-module totals.
        run: |
          if python3 -c '' 2>/dev/null; then PY=python3; else PY=python; fi
          $PY - <<'PYEOF'
          import glob
          import os
          import re
          import xml.etree.ElementTree as ET

          totals = {}
          for path in sorted(glob.glob("android/*/target/surefire-reports/TEST-*.xml") +
                             glob.glob("*/target/surefire-reports/TEST-*.xml")):
              module = path.replace("\\", "/").split("/target/")[0]
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as e:
                  print(f"[skip-report] could not parse {path}: {e}")
                  continue
              t = totals.setdefault(module, [0, 0, 0, 0])
              t[0] += int(root.get("tests", 0))
              t[1] += int(root.get("failures", 0))
              t[2] += int(root.get("errors", 0))
              t[3] += int(root.get("skipped", 0))
              for tc in root.iter("testcase"):
                  sk = tc.find("skipped")
                  if sk is None:
                      continue
                  cls, name = tc.get("classname", "?"), tc.get("name", "?")
                  reason = (sk.get("message") or (sk.text or "")).strip().splitlines()
                  reason = reason[0] if reason else ""
                  if not reason:
                      method = re.sub(r"[\[(].*", "", name)
                      src = glob.glob(f"{module}/test/{cls.replace('.', '/')}.java")
                      if src:
                          body = open(src[0], encoding="utf-8").read()
                          m = re.search(r"void " + re.escape(method) + r"\(.*?\n  \}", body, re.S)
                          if m:
                              lines = [l.strip() for l in m.group(0).splitlines() if "assume" in l]
                              if lines:
                                  reason = "assumption not met: " + lines[0]
                  print(f"SKIPPED {cls}.{name} -- reason: {reason or '(no message recorded)'}")

          for module, (n, f, e, s) in sorted(totals.items()):
              print(f"[surefire summary] {module}: tests={n} passed={n - f - e - s} "
                    f"failures={f} errors={e} skipped={s}")
          PYEOF
      - name: 'Upload guava jar'
        if: matrix.os == 'ubuntu-latest' && matrix.java == 17 && matrix.root-pom == 'pom.xml'
        uses: actions/upload-artifact@v4
        with:
          name: guava-jar
          path: guava/target/guava-33.6.0-jre.jar
          if-no-files-found: error
      - name: 'Print Surefire reports'
        # Note: Normally a step won't run if the job has failed, but this causes it to
        if: ${{ failure() }}
        shell: bash
        run: ./util/print_surefire_reports.sh
      - name: 'Set up Gradle'
        if: matrix.java == 11 # used only by the integration tests below
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
      - name: 'Integration Test'
        if: matrix.java == 11
        shell: bash
        run: util/gradle_integration_tests.sh

  publish_snapshot:
    name: 'Publish snapshot'
    needs: test
    if: github.event_name == 'push' && github.repository == 'google/guava'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 'Set up JDKs'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          # For discussion, see the first setup-java block.
          # The publish-snapshot workflow doesn't run tests, so we don't have to care which version Maven would select for that step.
          java-version: 26
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
      - name: 'Publish'
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
        run: ./util/deploy_snapshot.sh

  generate_docs:
    permissions:
      contents: write
    name: 'Generate latest docs'
    needs: test
    if: github.event_name == 'push' && github.repository == 'google/guava'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 'Set up JDKs'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          # For discussion, see the first setup-java block.
          # The generate-docs workflow doesn't run tests, so we don't have to care which version Maven would select for that step.
          # But we need Java 11 for JDiff.
          java-version: |
            11
            26
          distribution: 'temurin'
          cache: 'maven'
      - name: 'Generate latest docs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./util/update_snapshot_docs.sh
